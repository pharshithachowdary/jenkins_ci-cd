services:
  app:
    build: .
    image: cicd-automation-platform:local
    ports:
      - "8000:8000"
    environment:
      - APP_VERSION=local-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
